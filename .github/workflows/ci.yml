name: CI

# docs/PLAN.md says twice that the token-discipline check must run "from
# the first commit" — this is that. Runs npm test (typecheck +
# tokens:verify) plus a production build on every push and PR.

on:
  push:
    branches: [main]
  pull_request:
  # Manual re-run. Added because PR #15 opened with no CI run at all — the
  # pull_request event produced nothing, while the identical flow on #14
  # had produced one minutes earlier. A PR whose checks never register
  # looks the same at a glance as a PR that passed: one green Vercel
  # deployment and no red. Without this, the only way to get CI onto such
  # a commit is to push another one, which means the recovery for "CI did
  # not run" is to dirty the history.
  workflow_dispatch:

# A newer push on the same PR/branch supersedes the older run's answer
# before anyone reads it — without this, three jobs (one with a Playwright
# install, one replaying every migration onto a fresh Postgres) kept
# running to completion anyway, burning minutes on a result nobody would
# see.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# NOT WIRED HERE, ON PURPOSE: billing:verify, trip:verify, customisation:verify.
# All three were orphaned npm scripts (no CI job, no verify:all entry) and
# the fix looked like "add a step" until each was actually read.
#   - trip:verify and customisation:verify drive real signed-in Supabase
#     clients (admin.auth.admin.createUser, session.auth.signInWithPassword,
#     .from(...) over PostgREST) — that needs a live Supabase Auth + REST
#     API, not a bare Postgres. The `database` job below stands up
#     postgres:16 and talks to it with psql; there is no GoTrue or
#     PostgREST anywhere in this repo's CI, and supabase/config.toml says
#     outright this project "doesn't run `supabase start` locally yet — no
#     live project exists." Wiring these two needs that stack stood up
#     first (`supabase/setup-cli` + `supabase start`, migrations applied
#     automatically from supabase/migrations, NEXT_SUPABASE_URL/
#     NEXT_SUPABASE_PUBLISHABLE_KEY/NEXT_SUPABASE_SECRET_KEY exported from
#     `supabase status`) — a real, separate piece of infrastructure this
#     repo has explicitly deferred, not a step to bolt on here.
#   - billing:verify looks lighter (it only needs a running server, which
#     the `layout` job below already boots) until you read
#     app/api/stripe/webhook/route.ts: signature verification and the
#     livemode gate return before touching the database, but every other
#     section — idempotency, out-of-order delivery, retry safety, plan-tier
#     mapping — writes pilot.stripe_events through the SAME service-role
#     Supabase client, over the SAME missing PostgREST endpoint. Pointing it
#     at a placeholder NEXT_SUPABASE_URL (the way the `layout` job's dev
#     server already does, safely, because nothing on that job's path ever
#     queries it) would not skip those sections here — billing-verify.mjs's
#     own SKIP guard only covers the checks ITS OWN script-level db client
#     makes, not the route's. The route would attempt the write, get a
#     connection failure, and return 500 where the script expects 200 —
#     failing for an infrastructure reason having nothing to do with
#     whether the webhook handler is correct. A red check that means
#     nothing is worse than no check.
# Same root cause, all three: this repo has no live Supabase API anywhere
# in CI. Fixing it is one piece of infrastructure, not three, and it wants
# the owner's sign-off (a new job, a real image pull and boot cost, and a
# CLI-version decision) before it lands, not a silent add alongside a
# dependency-scanning task.

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # lib/supabase/service-role.ts's header enumerates every call site
      # allowed to construct the RLS-bypassing client, and that enumeration
      # IS the security control — the header says so directly. It has
      # already drifted four times silently (three files calling the
      # function unregistered for up to a day, two of them even miscounting
      # their own entry point number in their own header). This does not
      # try to diff the actual path list against the header's prose — a
      # markdown-parsing check is itself a maintenance burden and a new
      # source of false negatives if the header's wording shifts. It only
      # compares a COUNT, which is cheap, does not care about unrelated
      # refactors (renames, reformatting, reordering entries), and is
      # exactly the number the header already asserts in its own grep
      # command. Bumping this number is a required, visible part of adding
      # or removing a call site — the same way the header's own count is.
      - name: Service-role call-site count (drift check)
        run: |
          set -euo pipefail
          EXPECTED=10
          # The trailing `; true` matters under `pipefail`: grep exits 1 on
          # zero matches, which is a legitimate (if very unlikely) count of
          # zero, not a script bug — without it, that case would abort here
          # with a bare pipefail error instead of the clear message below.
          ACTUAL=$(grep -rl 'createServiceClient(' --include='*.ts' --include='*.tsx' app lib \
            | grep -v '^lib/supabase/service-role\.ts$' | wc -l | tr -d ' '; true)
          if [ "$ACTUAL" -ne "$EXPECTED" ]; then
            echo "::error::lib/supabase/service-role.ts's header claims $EXPECTED createServiceClient() call sites, but grep now finds $ACTUAL. This number moved because a call site was added or removed — not on its own a bug, but the header's numbered entry-point list (the actual security control) did not necessarily move with it. Re-read the header, add or remove the matching paragraph for your change, run the header's own grep command to confirm the new list is exhaustive, then update EXPECTED in this step to $ACTUAL."
            exit 1
          fi
          echo "service-role call sites: $ACTUAL (matches lib/supabase/service-role.ts's header)"

      # `npm test` already covers everything else; this is dependency supply
      # chain, not application code, so it is its own step rather than
      # folded into that one. --omit=dev: a dev-only advisory (a build tool,
      # a linter) cannot ship to a pilot's browser or the deployed server —
      # blocking the pipeline on one would train everyone to reach for
      # --force on a real advisory later. Verified before wiring this in:
      # `npm audit --omit=dev --audit-level=high` reports 0 vulnerabilities
      # today (2026-08-19), so this does not turn CI red on landing.
      - run: npm audit --omit=dev --audit-level=high

      - run: npm test

      # Deep ForeFlight CSV fixture (BOM, CRLF, 66-column padding, both
      # landing-column generations, multi-approach rows, FFS rows) — needs
      # no database and no browser (spawnSync runs a node subprocess
      # against a synthetic temp file), so it belongs here rather than a
      # dedicated job. Previously absent from `npm test` AND every CI job;
      # logbook:verify's own ForeFlight coverage is shallow by comparison.
      - run: npm run foreflight-import:verify

      - run: npm run build

  # The responsive contract — docs/RESPONSIVE-CONTRACT.md.
  #
  # Its own job rather than a step on `build`, for one reason: it is the only
  # thing in CI needing a browser binary, and confining that cost to a job
  # keeps it off the critical path of the typecheck/unit/build signal every
  # push depends on.
  #
  # What it protects: the shell governs the layout of every page, and until
  # this existed it had no automated check of any kind — it lived behind
  # requireAccount(), so it could not be rendered without a session, so it was
  # verified by looking at it at whatever window size the last person had
  # open. Three defects shipped that way, including a band between 768 and
  # 1023px (iPad portrait; a 1440px desktop at 175% zoom) where the usable
  # canvas was NARROWER than the phone layout gives at the same viewport.
  layout:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Chromium only. The contract is geometry — flexbox, grid, media
      # queries — and the three engines agree on all of it; adding Firefox and
      # WebKit would triple the setup for no extra signal.
      - run: npx playwright install --with-deps chromium

      # The DEV server, not a production build, and that is not a shortcut
      # around the harness's guard — it IS the guard. The harness is
      # development-only by construction: the page calls notFound(), and
      # lib/supabase/proxy.ts only allow-lists its path when NODE_ENV is
      # "development". `npm start` here would measure a redirect to /login at
      # every viewport and pass having asserted nothing.
      - name: Start dev server
        run: |
          npm run dev > /tmp/dev.log 2>&1 &
          # Plain curl rather than `npx wait-on`, to avoid pulling a package
          # off the network mid-job purely to poll a local port. Fails the
          # step loudly if the server never answers 200 — a silent timeout
          # here would hand the verify script a dead port and produce 160
          # identical, meaningless failures.
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/layout-harness || true)
            if [ "$code" = "200" ]; then echo "dev server up after ${i}s"; exit 0; fi
            sleep 2
          done
          echo "dev server did not serve /layout-harness within 120s (last code: ${code:-none})"
          cat /tmp/dev.log
          exit 1
        env:
          # The shell and the harness issue no queries, but the Supabase
          # clients are constructed at module scope and proxy.ts fails loudly
          # when these are unset. Placeholders are the CORRECT value here: a
          # real key would be a credential in CI for a surface that never
          # reaches the database. (Note the names — this product uses
          # NEXT_SUPABASE_*, not the conventional NEXT_PUBLIC_SUPABASE_*.)
          NEXT_SUPABASE_URL: http://localhost:54321
          NEXT_SUPABASE_PUBLISHABLE_KEY: ci-placeholder-publishable-key

      - run: npm run layout:verify

      # lib/receipt-ocr/engine.ts decodes images and drives a WebAssembly
      # worker — none of that exists in Node, so it is unit-testable only
      # up to lib/receipt-ocr/extract.ts. This drives the real engine in
      # the real Chromium this job already paid to install, self-contained
      # (its own static server, not the dev server above), and checks the
      # one privacy property that actually matters here: zero off-origin
      # requests during a scan. Previously wired into no CI job at all —
      # deliberately excluded from `npm test` (its own header explains why)
      # but never picked up here either, where the browser cost is already
      # sunk.
      - run: npm run receipt-ocr:verify

      - name: Dev server log on failure
        if: failure()
        run: cat /tmp/dev.log

  # The database half of the verification, which never ran before.
  #
  # Every DB-backed verify script takes a <NAME>_VERIFY_BOOTSTRAP pointing at a
  # Supabase-shaped scaffold, and no such file used to ship — so each of them
  # SKIPPED here and printed its own success line having asserted none of the
  # RLS refusals, none of the CHECK constraints, and neither side of the
  # two-tenant isolation gate that docs/PLAN.md makes the gate on Phase 1. A
  # suite that silently tests nothing is worse than one that is missing,
  # because it reads as coverage. scripts/lib/verify-bootstrap.sql is that
  # file, and this job is what makes it run.
  database:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 55432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      # The scripts default to this URL, so it is set once here rather than
      # per-step. Port 55432 matches the default so a local run and a CI run
      # exercise the same code path.
      PGHOST: 127.0.0.1
      PGPORT: 55432
      PGUSER: postgres

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Install psql
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      # These three read an already-migrated database over DATABASE_URL rather
      # than building their own, so the schema is assembled once here.
      - name: Build the migrated database
        run: |
          set -euo pipefail
          psql -X -q -v ON_ERROR_STOP=1 \
            "postgresql://postgres@127.0.0.1:55432/postgres" \
            -c "create database v1verify"
          U="postgresql://postgres@127.0.0.1:55432/v1verify"
          psql -X -q -v ON_ERROR_STOP=1 "$U" -f scripts/lib/verify-bootstrap.sql
          for m in supabase/migrations/*.sql; do
            psql -X -q -v ON_ERROR_STOP=1 "$U" -f "$m"
          done

      - name: Two-tenant isolation, Connect, the public invoice share, the credential-packet share, autopay, and bank import
        env:
          DATABASE_URL: postgresql://postgres@127.0.0.1:55432/v1verify
        run: |
          set -euo pipefail
          node scripts/tenancy-verify.mjs
          node scripts/connect-verify.mjs
          node scripts/invoice-share-verify.mjs

          # pilot.document_packet_public — the anon-callable boundary behind
          # app/packet/[token] serving W-9/passport/medical metadata. Same
          # rolled-back-transaction pattern as invoice-share-verify above;
          # previously had zero coverage anywhere (no verify script, no
          # unit test).
          node scripts/packet-share-verify.mjs

          # The account lifecycle: reset, deactivate, delete. These functions
          # delete a tenant's records irreversibly and one of them deletes an
          # airman's logbook, so the claims about them are asserted by DOING
          # them — the owner gate refuses a member, a stranger and anon; the
          # purge spares logbook/documents/aircraft and the number sequence;
          # a reset does take the logbook; a delete cascades but leaves
          # pilot.stripe_events. The static sibling (npm test) only reads the
          # migration text; this is the half that runs it, and it caught
          # deactivate_account writing a column the protect trigger reserves
          # for service_role on its very first run.
          node scripts/account-lifecycle-db-verify.mjs

          # Autopay's authorization boundary (20260817160000_autopay.sql):
          # the five autopay_* columns on pilot.clients withheld from every
          # authenticated grant, service_role's own write path, the
          # half-saved-mandate CHECK constraint, client_autopay_disable's
          # owner-only gate, and connect_account_unlink clearing enrollment.
          # Previously had zero coverage anywhere — no verify script existed
          # for this feature at all until now, on a feature whose whole
          # premise is charging a card with nobody confirming it that day.
          node scripts/autopay-verify.mjs

          # PART 1 (lib/bank-import/* parsing + fingerprint stability) needs
          # nothing; PART 2 (the bank schema contract) reads DATABASE_URL,
          # already exported above. Previously wired into no job at all, so
          # neither half ran anywhere in CI.
          node --experimental-strip-types scripts/bank-import-verify.mjs

      # These build their own scratch database from the scaffold, so they only
      # need to be told where it is.
      - name: Schema-contract suites
        env:
          AIRCRAFT_VERIFY_BOOTSTRAP: scripts/lib/verify-bootstrap.sql
          INVOICE_SETTINGS_VERIFY_BOOTSTRAP: scripts/lib/verify-bootstrap.sql
          PAYMENT_REVERSAL_VERIFY_BOOTSTRAP: scripts/lib/verify-bootstrap.sql
          ESTIMATES_VERIFY_BOOTSTRAP: scripts/lib/verify-bootstrap.sql
          LOGBOOK_VERIFY_BOOTSTRAP: scripts/lib/verify-bootstrap.sql
          CURRENCY_VERIFY_BOOTSTRAP: scripts/lib/verify-bootstrap.sql
          ACCOUNTING_VERIFY_BOOTSTRAP: scripts/lib/verify-bootstrap.sql
          REMINDERS_VERIFY_BOOTSTRAP: scripts/lib/verify-bootstrap.sql
          ADHOC_INVOICE_VERIFY_BOOTSTRAP: scripts/lib/verify-bootstrap.sql
        run: |
          set -euo pipefail
          npm run aircraft:verify
          npm run invoice-settings:verify
          npm run payment-reversal:verify
          npm run estimates:verify
          npm run logbook:verify
          npm run currency:verify
          npm run accounting:verify
          npm run reminders:verify
          # This one ran in `npm run verify:all` but NOT here, so when
          # 20260820100000 added a fourth pilot.invoices policy and left this
          # suite's hardcoded "expected 3" behind, CI stayed green while the
          # gate CLAUDE.md calls mandatory was red on main. Every suite
          # verify:all runs must run here too, or the two disagree in silence.
          npm run adhoc-invoice:verify
